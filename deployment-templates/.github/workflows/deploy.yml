name: Build and Deploy JupyterLite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install R Kernel (WebR)
        run: |
          python -m pip install jupyterlite-webr-kernel

      - name: Install PKM Extension
        run: |
          # Install from GitHub repository
          pip install git+https://github.com/XLabCU/jupyterlite-pkm.git

          # Verify installation
          echo "Installed extensions:"
          jupyter labextension list

      - name: Build JupyterLite site
        run: |
          # Build the site with content directory
          jupyter lite build --contents content --output-dir dist

          # Create .nojekyll to disable Jekyll processing
          touch dist/.nojekyll

          # Copy any additional files
          if [ -f "CNAME" ]; then
            cp CNAME dist/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Only deploy on push to main (not on PRs)
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
